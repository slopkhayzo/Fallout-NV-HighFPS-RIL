; FalloutNVHFR 1.0.0
;
; The switches you may want to change come first in each section. Everything
; under "Internals" has to stay as it is for the patch to work.
;
; To disable the patch without removing it, set bEnabled=0.

[General]
; Master switch. 1 = the patch is active from game start. 0 = the game runs
; unmodified.
bEnabled=1

; Writes a status block to FalloutNVHFR.log every five seconds. Only useful
; for reporting a problem: the file grows by several megabytes an hour.
; 0 = only a few lines per game start are written.
bTelemetry=0

[Timing]
; Simulation rate in ticks per second. The game is known to misbehave when
; simulated faster than 60, and the patch does not accept more. Leave at 60.
fSimulationHz=60.0

; Menus, conversations, loading and the 30 frames after them cannot use the
; patch's frozen in-between frames. With 1 they run on the real frame time
; instead, which keeps characters smooth there (for example a character
; turning to face you when a conversation starts), but it means the game is
; stepped at your frame rate on those frames. If you get a crash or a physics
; glitch right after closing a menu, set this to 0: menus then run at 60 ticks
; a second and those moments look stepped.
bMenuRealTime=1

; ---- Internals: do not change ----
bFixedTick=1
fMaxWallDeltaMs=250.0
bNoTimerSleeps=1
bFreezeFrames=1
bAlignHavokStep=1

[Input]
; Removes the acceleration of the mouse cursor in menus by setting the game's
; four fForegroundMouse settings to 0 while it runs. 0 = leave the cursor as
; the game has it.
bMenuMouseNoAcceleration=1

; ---- Internals: do not change ----
bLatchInput=1

[Presentation]
; ---- Internals: do not change ----
bInterpolateCamera=1
bShiftSky=1
bThirdPersonCamera=1
bThirdPersonBody=1
bFirstPerson=1
bInterpolateFov=1
bInterpolateActors=1
bInterpolateObjects=1

[Tracing]
; ---- Internals: do not change ----
bAimTrace=0
